<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>bài tập 3</title>
</head>
<body>
    <h1>BÀI 3: HIỂN THỊ NỘI DUNG</h1>
    <button onclick="anhien()"> Mở/Ẩn chi tiết</button>
    <p id="nd"></p>   
</body>
</html>
<script>
    var dem=1;
    var text="Đây là nội dung chi tiết về JavaScript. JavaScript là ngõ web tương tác."; 
    function anhien() {
        dem += 1;
        if(dem % 2==0)document.getElementById("nd").innerHTML=text;
        else document.getElementById("nd").innerHTML="";
    }
</script>
