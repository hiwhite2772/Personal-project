<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài tập 02</title>
</head>
<body>
    <h1>BÀI 2: THAY ĐỔI MÀU SẮC</h1>
    <p id="dv"> đây là đoạn văn có thể thay đổi màu sắc</p>
    <button onclick="mauchu()"> Đổi màu chữ </button>
    <button onclick="maunen()"> Đổi màu nền</button>
</body>
</html>
<script>
        function mauchu() {
        document.getElementById("dv").style.color = "yellow";
    }
    function maunen() {
        document.getElementById("dv").style.backgroundColor = "grey";
    }
</script>
