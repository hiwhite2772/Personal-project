<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bài 5: Bật/Tắt đèn</title>
</head>
<body>
  <h1>BÀI 5: BẬT/ TẮT ĐÈN</h1>
  <button onclick="bat()">Bật</button>
  <img src="images/toi.GIF"  alt="bóng đèn" id="den">
  <button onclick="tat()">Tắt</button>

  </body>
<script>
        function bat() {
          document.getElementById("den").src= "images/sang.GIF";
        }

        function tat() {
          document.getElementById("den").src= "images/toi.GIF";
        }

</script>
</html>
